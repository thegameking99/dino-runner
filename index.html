<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache">
    <title>Dino Runner - Stabil & Cantik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 10px;
        }
        #gameWrap {
            width: 100%; max-width: 500px;
            height: 70vh; min-height: 400px;
            border-radius: 16px; overflow: hidden;
            position: relative;
            box-shadow: 0 8px 32px rgba(0,0,0,.5);
        }
        #gameCanvas {
            background: #bbdefb;
            width: 100%; height: 100%;
            display: block;
        }
        #touchArea {
            position: absolute; inset: 0;
            z-index: 10; cursor: pointer;
        }
        .hud {
            position: absolute; top: 10px;
            background: rgba(255,255,255,.9);
            padding: 8px 16px; border-radius: 12px;
            font-weight: bold; font-size: 1.1rem;
            z-index: 20;
        }
        #scoreHud { left: 10px; }
        #timeHud { right: 10px; }

        .screen {
            position: absolute; inset: 0;
            background: rgba(15,23,42,.92);
            z-index: 30;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; padding: 20px;
        }
        .hide { display: none !important; }

        button {
            border: none; border-radius: 12px;
            padding: 14px 32px; margin: 8px auto;
            font-size: 1.2rem; font-weight: bold;
            width: 90%; max-width: 300px;
            cursor: pointer;
        }
        .btn-blue { background: #2563eb; color:white; }
        .btn-green { background: #16a34a; color:white; }
        .btn-orange { background: #d97706; color:white; }
        input {
            padding: 12px; width: 90%; max-width:300px;
            border-radius: 10px; border:none;
            text-align:center; font-size:1.1rem; margin-bottom:15px;
        }
    </style>
</head>
<body>
<div id="gameWrap">
    <canvas id="gameCanvas"></canvas>
    <div id="scoreHud" class="hud">Skor: 0</div>
    <div id="timeHud" class="hud">Masa: 0s</div>
    <div id="touchArea"></div>

    <div id="startScreen" class="screen">
        <h1 class="text-3xl font-bold mb-4">🦖 DINO RUNNER</h1>
        <p class="mb-2">👆 Ketuh skrin / Tekan Ruang untuk lompat</p>
        <p class="mb-6 text-slate-300">Kelajuan bertambah perlahan</p>
        <button id="startBtn" class="btn-blue">▶️ MULA</button>
    </div>

    <div id="overScreen" class="screen hide">
        <h2 class="text-2xl font-bold text-red-400 mb-4">TAMAT!</h2>
        <p class="text-xl mb-1">Masa: <span id="resTime">0</span> s</p>
        <p class="text-xl mb-4">Skor: <span id="resScore">0</span></p>
        <input type="text" id="playerName" placeholder="Nama anda...">
        <button id="saveBtn" class="btn-green">✅ Simpan</button>
        <button id="restartBtn" class="btn-blue">🔄 Main Semula</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
    apiKey: "AlzaSyDQ_MoqFHsVIpfq8YefgToN1S9j-p8mRv0",
    authDomain: "dino-runner-scores.firebaseapp.com",
    databaseURL: "https://dino-runner-scores-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "dino-runner-scores"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Unsur & Kanvas
const c = document.getElementById('gameCanvas');
const ctx = c.getContext('2d');
const wrap = document.getElementById('gameWrap');
const touch = document.getElementById('touchArea');

// Pemboleh ubah Permainan - DIRESET DENGAN BETUL
let running = false;
let score = 0;
let timeSec = 0;
let lastTime = 0;
let groundY = 0;
let speed = 3.5;
let obstacles = [];
let animFrame = null;

// Dino Mudah & Jelas - Sentiasa Kelihatan
const dino = {
    x: 50, w: 44, h: 48, y: 0,
    vy: 0, jumpPower: -13, gravity: 0.65,
    onGround: true
};

// Saiz & Latar
function resize() {
    c.width = wrap.clientWidth;
    c.height = wrap.clientHeight;
    groundY = c.height - 50;
    dino.y = groundY - dino.h;
}

// Lukis Dino Rapi & Mudah
function drawDino() {
    ctx.fillStyle = "#22c55e";
    ctx.fillRect(dino.x+8, dino.y+14, 28, 24); // Badan
    ctx.beginPath(); ctx.arc(dino.x+32, dino.y+16, 13, 0, Math.PI*2); ctx.fill(); // Kepala
    
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(dino.x+38,dino.y+12,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(dino.x+39,dino.y+13,2,0,Math.PI*2); ctx.fill();
    
    ctx.fillStyle="#15803d";
    ctx.fillRect(dino.x+10, dino.y+36, 6, 12); // Kaki
    ctx.fillRect(dino.x+28, dino.y+36, 6, 12);
}

// Halangan & Tanah
function drawBg() {
    ctx.fillStyle="#bbdefb"; ctx.fillRect(0,0,c.width,c.height);
    ctx.fillStyle="#8b4513"; ctx.fillRect(0,groundY,c.width,50);
    ctx.fillStyle="#2e7d32"; ctx.fillRect(0,groundY,c.width,6);
}

function drawObstacles() {
    obstacles.forEach(h => {
        ctx.fillStyle="#5d4037";
        if(h.type==="cactus") {
            ctx.fillRect(h.x,h.y,h.w,h.h);
            ctx.fillRect(h.x-h.w/2,h.y+h.h*0.2,h.w*1.5,h.h*0.2);
        } else {
            ctx.fillRect(h.x,h.y,h.w,h.h);
        }
    });
}

function spawnObstacle() {
    const types = ["cactus", "cactus"];
    let w = 22 + Math.random()*8;
    let h = 38 + Math.random()*18;
    obstacles.push({
        x: c.width + 30,
        y: groundY - h,
        w: w, h: h,
        type: types[Math.floor(Math.random()*types.length)]
    });
}

// Lompat
function jump() {
    if(dino.onGround && running) {
        dino.vy = dino.jumpPower;
        dino.onGround = false;
    }
}

// LINGKARAN UTAMA - TIDAK GANJIL BILA DIULANG
function loop(timestamp) {
    if(!running) return;

    // ✅ Kiraan Masa & Skor SEIMBANG
    let dt = timestamp - lastTime;
    lastTime = timestamp;

    // Kemas kini Masa & Skor berasingan
    score += Math.round(dt / 50); // Skor perlahan & munasabah
    timeSec = Math.floor(timestamp / 1000);

    document.getElementById("scoreHud").textContent = "Skor: " + score;
    document.getElementById("timeHud").textContent = "Masa: " + timeSec + "s";

    // Kelajuan perlahan
    speed += 0.002;

    // Fizik Lompat
    dino.vy += dino.gravity;
    dino.y += dino.vy;
    if(dino.y + dino.h >= groundY) {
        dino.y = groundY - dino.h;
        dino.vy = 0; dino.onGround = true;
    }

    // Halangan
    obstacles = obstacles.filter(o => { o.x -= speed; return o.x > -60; });
    if(!obstacles.length || obstacles[obstacles.length-1].x < c.width - (140+Math.random()*120)) spawnObstacle();

    // Perlanggaran
    for(let o of obstacles) {
        if( dino.x+6 < o.x+o.w && dino.x+dino.w-6 > o.x &&
            dino.y+8 < o.y+o.h && dino.y+dino.h > o.y ) {
            gameOver(); return;
        }
    }

    ctx.clearRect(0,0,c.width,c.height);
    drawBg(); drawObstacles(); drawDino();

    animFrame = requestAnimationFrame(loop);
}

// MULA / MULA SEMULA - ✅ SEMUA DIRESET SEPENUHNYA
function startGame() {
    // Hentikan gelung lama jika ada
    if(animFrame) cancelAnimationFrame(animFrame);
    
    // Sembunyi skrin
    document.getElementById("startScreen").classList.add("hide");
    document.getElementById("overScreen").classList.add("hide");

    // SET SEMULA KEADAAN PENUH
    resize();
    score = 0; timeSec = 0; speed = 3.5;
    obstacles = [];
    dino.x = 50; dino.y = groundY - dino.h;
    dino.vy = 0; dino.onGround = true;
    
    running = true;
    lastTime = performance.now();
    animFrame = requestAnimationFrame(loop);
}

function gameOver() {
    running = false;
    if(animFrame) cancelAnimationFrame(animFrame);
    
    document.getElementById("resScore").textContent = score;
    document.getElementById("resTime").textContent = timeSec;
    document.getElementById("overScreen").classList.remove("hide");
}

function saveRecord() {
    db.ref("scores").push({
        name: document.getElementById("playerName").value || "Tetamu",
        score: score, time: timeSec
    }).then(()=>alert("✅ Disimpan!"));
}

// Kawalan Sentuh & Papan Kekunci
touch.addEventListener("touchstart", e=>{e.preventDefault(); jump();});
touch.addEventListener("mousedown", jump);
document.addEventListener("keydown", e=>{ if(e.code==="Space") {e.preventDefault(); jump();} });

// Butang
document.getElementById("startBtn").onclick = startGame;
document.getElementById("restartBtn").onclick = startGame;
document.getElementById("saveBtn").onclick = saveRecord;

// Sedia Mula Pertama Kali
resize();
drawBg(); drawDino();
window.addEventListener("resize", ()=>{resize(); drawBg(); drawDino();});
</script>
</body>
</html>
