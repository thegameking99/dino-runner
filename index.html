<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Dino Fix Muktamad</title>
<style>
* {margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:#111;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;}
#kotak{width:min(96%,500px);height:min(70vh,500px);position:relative;border-radius:14px;overflow:hidden;}
#kanvas{background:#a3d8ff;width:100%;height:100%;display:block;}
#sentuh{position:absolute;inset:0;z-index:5;}
#info{position:absolute;top:8px;left:8px;right:8px;display:flex;justify-content:space-between;z-index:6;}
.kotak-kecil{background:rgba(255,255,255,.9);padding:6px 14px;border-radius:10px;font-weight:bold;}
.lindung{position:absolute;inset:0;background:rgba(0,0,0,.8);z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;color:white;gap:1rem;padding:1rem;}
.sembunyi{display:none !important;}
button{padding:.9rem 2rem;border:none;border-radius:12px;font-weight:bold;font-size:1.1rem;width:min(100%,280px);cursor:pointer;}
.biru{background:#2563eb;color:#fff;}
.hijau{background:#16a34a;color:#fff;}
</style>
</head>
<body>

<div id="kotak">
    <canvas id="kanvas"></canvas>
    <div id="sentuh"></div>
    <div id="info">
        <div class="kotak-kecil">Skor: <span id="nilaiSkor">0</span></div>
        <div class="kotak-kecil">Masa: <span id="nilaiMasa">0</span>s</div>
    </div>

    <div id="mulaSkrin" class="lindung">
        <h2 style="font-size:1.6rem">🦖 KETUH SKRIN UNTUK LOMPAT</h2>
        <button id="btnMula" class="biru">MULAI PERMAINAN</button>
    </div>

    <div id="tamatSkrin" class="lindung sembunyi">
        <h2 style="color:#ff6b6b">TAMAT!</h2>
        <p>Skor Akhir: <b id="tamatSkor">0</b></p>
        <p>Masa: <b id="tamatMasa">0</b>s</p>
        <button id="btnUlang" class="biru">🔄 MAIN SEMULA</button>
    </div>
</div>

<script>
// UNSUR UTAMA
const kanv = document.getElementById('kanvas');
const k = kanv.getContext('2d');
const kotak = document.getElementById('kotak');
const sentuh = document.getElementById('sentuh');

// PEMBOLEH UBAH - SENTIASA DIRESET SEPENUHNYA
let berjalan = false;
let masaMula = 0;
let masaTerkini = 0;
let skor = 0;
let tanahY = 0;
let halangan = [];
let kelajuan = 3.5;
let idGelung = null;

// OBJEK DINO - MUDAH & TETAP KELIHATAN
const dino = {
    x: 50, l: 40, t: 45, y: 0,
    lompatKuat: -14, tarikan: 0.7, lajuY: 0, diTanah: true
};

// SAIZ KANVAS
function ubahSaiz(){
    kanv.width = kotak.clientWidth;
    kanv.height = kotak.clientHeight;
    tanahY = kanv.height - 50;
    dino.y = tanahY - dino.t;
}

// LUKIS DINO JELAS & TIDAK PELIK
function lukisDino(){
    k.fillStyle="#22bb55";
    k.fillRect(dino.x+6, dino.y+12, 26, 22);
    k.beginPath(); k.arc(dino.x+30, dino.y+15, 11, 0, Math.PI*2); k.fill();
    
    k.fillStyle="#fff";
    k.beginPath(); k.arc(dino.x+35, dino.y+11, 5, 0, Math.PI*2); k.fill();
    k.fillStyle="#000";
    k.beginPath(); k.arc(dino.x+36, dino.y+12, 2, 0, Math.PI*2); k.fill();

    k.fillStyle="#157d32";
    k.fillRect(dino.x+8, dino.y+34, 5, 11);
    k.fillRect(dino.x+25, dino.y+34, 5, 11);
}

// LATAR & TANAH
function lukisLatar(){
    k.clearRect(0,0,kanv.width,kanv.height);
    k.fillStyle="#a3d8ff"; k.fillRect(0,0,kanv.width,kanv.height);
    k.fillStyle="#7a4514"; k.fillRect(0,tanahY,kanv.width,50);
    k.fillStyle="#239b33"; k.fillRect(0,tanahY,kanv.width,5);
}

// HALANGAN
function buatHalangan(){
    halangan.push({
        x: kanv.width + 20,
        y: tanahY - 42,
        l: 20, t: 42
    });
}

function lukisHalangan(){
    halangan.forEach(h=>{
        k.fillStyle="#5c3c18";
        k.fillRect(h.x,h.y,h.l,h.t);
    });
}

// LOMPAT
function lompat(){
    if(dino.diTanah && berjalan){
        dino.lajuY = dino.lompatKuat;
        dino.diTanah = false;
    }
}

// GELUNG UTAMA - DIREKA SUPAYA TIDAK ROSAK BILA DIULANG
function gelungUtama(masa){
    if(!berjalan) return;

    // KIRAAN LICIN & TEPAT
    masaTerkini = Math.floor((masa - masaMula)/1000);
    skor += 1; // Kadar skor stabil
    document.getElementById('nilaiSkor').textContent = skor;
    document.getElementById('nilaiMasa').textContent = masaTerkini;

    // Kelajuan perlahan
    kelajuan += 0.003;

    // Fizik Dino
    dino.lajuY += dino.tarikan;
    dino.y += dino.lajuY;
    if(dino.y + dino.t >= tanahY){
        dino.y = tanahY - dino.t;
        dino.diTanah = true;
        dino.lajuY = 0;
    }

    // Halangan & jarak
    halangan = halangan.filter(h=>{h.x -= kelajuan; return h.x > -40;});
    if(halangan.length === 0 || halangan[halangan.length-1].x < kanv.width - 160){
        buatHalangan();
    }

    // PERLANGGARAN
    for(let h of halangan){
        if( dino.x+6 < h.x+h.l && dino.x+dino.l-6 > h.x &&
            dino.y+4 < h.y+h.t && dino.y+dino.t > h.y ){ tamat(); return; }
    }

    lukisLatar(); lukisHalangan(); lukisDino();
    idGelung = requestAnimationFrame(gelungUtama);
}

// MULA / MULA SEMULA: PADAM SEGALA-GALANYA DULU
function mulaBaru(){
    // HENTIKAN & PADAM LAMA DULU
    if(idGelung) cancelAnimationFrame(idGelung);

    // SEMUA DIKOSONGKAN & DIRESET MUTLAK
    berjalan = false; skor = 0; masaTerkini = 0;
    halangan = []; kelajuan = 3.5;
    ubahSaiz();
    dino.x = 50; dino.y = tanahY - dino.t; dino.lajuY = 0; dino.diTanah = true;

    // SKRIN
    document.getElementById('mulaSkrin').classList.add('sembunyi');
    document.getElementById('tamatSkrin').classList.add('sembunyi');
    document.getElementById('nilaiSkor').textContent = "0";
    document.getElementById('nilaiMasa').textContent = "0";

    // MULA LAGI DARI AWAL
    berjalan = true;
    masaMula = performance.now();
    idGelung = requestAnimationFrame(gelungUtama);
}

function tamat(){
    berjalan = false;
    if(idGelung) cancelAnimationFrame(idGelung);
    document.getElementById('tamatSkor').textContent = skor;
    document.getElementById('tamatMasa').textContent = masaTerkini;
    document.getElementById('tamatSkrin').classList.remove('sembunyi');
}

// KAWALAN: SENTUH & KEKUNCI
sentuh.addEventListener('touchstart',(e)=>{e.preventDefault();lompat();});
sentuh.addEventListener('mousedown',lompat);
document.addEventListener('keydown',(e)=>{if(e.code==="Space"){e.preventDefault();lompat();}});

// BUTANG
document.getElementById('btnMula').onclick = mulaBaru;
document.getElementById('btnUlang').onclick = mulaBaru;

// SAAT MULA-MULA LUKIS
ubahSaiz(); lukisLatar(); lukisDino();
window.addEventListener('resize',ubahSaiz);
</script>
</body>
</html>
