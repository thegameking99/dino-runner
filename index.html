<html style="margin:0;padding:0;">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: linear-gradient(to bottom,#87CEEB 0%,#faf9f4 100%);
    min-height: 100vh; margin:0; padding:8px;
    font-family:'Fredoka',sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
</style>
<body>
  <div style="width:100%;max-width:900px;">
    <h1 style="text-align:center;font-size:18px;font-weight:700;color:#0f172a;margin:0 0 8px 0;text-shadow:1px 1px 0 #fff;">Dino Runner - Lompat Halangan</h1>
    
    <div id="gameWrap" style="position:relative;border:3px solid #0f172a;border-radius:14px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,0.2);background:#faf9f4;touch-action:manipulation;user-select:none;width:100%;aspect-ratio:800/360;max-height:85vh;">
      <canvas id="gameCanvas" style="display:block;width:100%;height:100%;touch-action:manipulation;cursor:pointer;"></canvas>
      
      <div id="scorePanel" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.95);padding:4px 10px;border-radius:6px;font-size:13px;font-weight:600;color:#0f172a;border:2px solid rgba(15,23,42,0.2);font-variant-numeric:tabular-nums;z-index:10;">Masa: 0s | Skor: 0</div>
      
      <div id="startPanel" style="position:absolute;inset:0;background:rgba(15,23,42,0.85);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;z-index:20;">
        <div style="font-size:clamp(22px,5vw,34px);font-weight:700;margin-bottom:8px;">DINO RUNNER</div>
        <div style="font-size:clamp(13px,2.5vw,16px);opacity:0.9;margin-bottom:18px;line-height:1.5;">Ketuh skrin untuk lompat!<br>Elak kaktus, pagar & batu</div>
        
        <div style="width:100%;max-width:260px;margin-bottom:16px;text-align:left;">
          <label style="font-size:15px;opacity:0.95;">Nama anda:</label>
          <input type="text" id="playerName" placeholder="Masukkan nama..." maxlength="12" value="Uji" style="width:100%;padding:10px 14px;font-size:17px;border-radius:8px;border:none;outline:none;color:#0f172a;margin-top:6px;font-family:inherit;">
        </div>
        
        <button id="startBtn" style="background:#297a2e;color:#fff;border:none;padding:14px 36px;font-size:clamp(16px,3vw,21px);font-weight:bold;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #1a5220;min-width:170px;">MULA</button>
        <button id="leaderBtn" style="background:#4f46e5;color:#fff;border:none;padding:10px 24px;font-size:16px;font-weight:600;border-radius:10px;cursor:pointer;box-shadow:0 3px 0 #3730a3;margin-top:14px;">PAPAN KETUA</button>
      </div>
      
      <div id="overPanel" style="position:absolute;inset:0;background:rgba(15,23,42,0.88);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:20px;z-index:20;overflow-y:auto;">
        <div style="font-size:clamp(20px,4.5vw,30px);font-weight:bold;margin-bottom:10px;">HABIS GAME!</div>
        <div id="finalInfo" style="font-size:clamp(14px,2.8vw,19px);margin-bottom:12px;line-height:1.6;"></div>
        <div id="newRecord" style="color:#facc15;font-size:clamp(14px,2.8vw,19px);font-weight:bold;margin-bottom:12px;display:none;">SKOR BARU MASUK 10 TERATAS!</div>
        <button id="submitScoreBtn" style="background:#facc15;color:#0f172a;border:none;padding:10px 26px;font-size:16px;font-weight:bold;border-radius:10px;cursor:pointer;margin-bottom:12px;display:none;">HANTAR SKOR</button>
        <button id="againBtn" style="background:#d97706;color:#fff;border:none;padding:14px 36px;font-size:clamp(16px,3vw,21px);font-weight:bold;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #92400e;min-width:170px;">MAIN SEMULA</button>
        <button id="toLeaderBtn" style="background:#4f46e5;color:#fff;border:none;padding:10px 24px;font-size:16px;border-radius:10px;cursor:pointer;margin-top:14px;">PAPAN KETUA</button>
      </div>
      
      <div id="leaderPanel" style="position:absolute;inset:0;background:rgba(15,23,42,0.92);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:20px;z-index:20;overflow-y:auto;">
        <div style="font-size:26px;font-weight:bold;margin-bottom:15px;">🏆 10 TERATAS</div>
        <div id="leaderList" style="width:100%;max-width:300px;background:rgba(255,255,255,.1);border-radius:12px;padding:15px;margin-bottom:15px;min-height:100px;"></div>
        <button id="closeLeaderBtn" style="background:#64748b;color:#fff;border:none;padding:12px 30px;font-size:17px;border-radius:10px;cursor:pointer;">⬅️ KEMBALI</button>
      </div>
    </div>
    
    <p style="text-align:center;font-size:12px;color:#64748b;margin-top:10px;">💡 Ketuh mana-mana kawasan skrin untuk lompat</p>
  </div>

<script>
// Simpan & baca skor tempatan sah
const LEADERBOARD_KEY = 'dino_runner_global_leaderboard';
let leaderboard = [];

function loadLeaderboard() {
  try {
    const saved = localStorage.getItem(LEADERBOARD_KEY);
    leaderboard = saved ? JSON.parse(saved) : [];
  } catch(e) { leaderboard = [] }
  renderLeaderboard();
}
function saveLeaderboard() {
  localStorage.setItem(LEADERBOARD_KEY, JSON.stringify(leaderboard));
}
function addScore(name, score, time) {
  name = (name||'Pemain Tanpa Nama').trim().substring(0,12) || 'Pemain Tanpa Nama';
  leaderboard.push({name,score,time,date:new Date().toLocaleDateString('ms-MY')});
  leaderboard.sort((a,b)=>b.score-a.score);
  leaderboard = leaderboard.slice(0,10);
  saveLeaderboard(); renderLeaderboard();
}
function renderLeaderboard() {
  const list = document.getElementById('leaderList');
  if(!leaderboard.length){ list.innerHTML="<p style='opacity:.7'>Belum ada rekod.<br>Jadilah pertama!</p>"; return; }
  list.innerHTML = leaderboard.map((e,i)=>{
    const m = ['🥇','🥈','🥉'][i]||`${i+1}.`;
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 5px;border-bottom:1px solid rgba(255,255,255,.15);">
      <span style="width:30px">${m}</span>
      <span style="flex:1;text-align:left;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${e.name}</span>
      <span style="font-weight:bold;color:#facc15">${e.score}</span>
    </div>`
  }).join('');
}

document.addEventListener('DOMContentLoaded', () => {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const [W,H,gY] = [800,360,300]; canvas.width=W; canvas.height=H;

  // UI Unsur
  const startP = document.getElementById('startPanel');
  const overP = document.getElementById('overPanel');
  const leaderP = document.getElementById('leaderPanel');
  const scoreDisp = document.getElementById('scorePanel');
  const nameInp = document.getElementById('playerName');
  const [startBtn, leaderBtn, againBtn, closeLeaderBtn, submitBtn, toLeaderBtn] = 
    ['startBtn','leaderBtn','againBtn','closeLeaderBtn','submitScoreBtn','toLeaderBtn'].map(id=>document.getElementById(id));
  const finalInfo = document.getElementById('finalInfo'), newNotif = document.getElementById('newRecord');

  let run = false, time=0, score=0, lastT=0, obsT=0, pending=null;
  let audioCtx=null;

  loadLeaderboard();

  // Bunyi ringkas
  const beep=(f,d,t='sine',v=.2)=>{
    if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended') audioCtx.resume();
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.type=t;o.frequency.value=f;g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+d);
    o.connect(g);g.connect(audioCtx.destination);
    o.start();o.stop(audioCtx.currentTime+d);
  };

  // Dino & Halangan
  const dino={
    x:70,y:gY,w:52,h:58,vy:0,jump:false,
    reset(){this.y=gY;this.vy=0;this.jump=false},
    doJump(){if(!this.jump){this.vy=-14;this.jump=true;beep(440,.06)}},
    update(){
      if(!this.jump) return;
      this.vy+=0.65; this.y+=this.vy;
      if(this.y>=gY){this.y=gY;this.jump=false;this.vy=0}
    },
    draw(){
      ctx.fillStyle='#5a9e3a'; ctx.beginPath();
      ctx.ellipse(this.x+25,this.y-30,23,18,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(this.x+42,this.y-48,14,12,.2,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(this.x+48,this.y-50,4,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(this.x+49,this.y-50,2,0,Math.PI*2); ctx.fill();
      ctx.fillRect(this.x+10,this.y-12,10,12); ctx.fillRect(this.x+30,this.y-10,10,14);
    },
    box(){return {x:this.x+6,y:this.y-this.h+6,w:this.w-12,h:this.h-8}}
  };

  let obstacles=[],clouds=[];
  const initClouds=()=>{clouds=Array.from({length:4},()=>({x:Math.random()*W,y:40+Math.random()*50,s:.5+.4*Math.random()}))};
  
  function addObs(){
    if(obstacles.length && obstacles.at(-1).x>W-280) return;
    const types=[{t:'cactus',w:26,h:52},{t:'fence',w:44,h:34},{t:'rock',w:34,h:26}];
    const sel=types[Math.floor(Math.random()*3)];
    obstacles.push({x:W+10,...sel,y:gY-sel.h});
  }
  
  function drawObs(o){
    if(o.t==='cactus'){
      ctx.fillStyle='#2d8a3e'; ctx.fillRect(o.x+6,o.y,10,o.h);
      ctx.fillRect(o.x,o.y+12,8,6); ctx.fillRect(o.x+18,o.y+8,8,6);
    } else if(o.t==='fence'){
      ctx.fillStyle='#8B4513'; for(let i=0;i<4;i++) ctx.fillRect(o.x+i*11,o.y,5,o.h);
      ctx.fillStyle='#653b0e'; ctx.fillRect(o.x,o.y+10,o.w,3); ctx.fillRect(o.x,o.y+20,o.w,3);
    } else { ctx.fillStyle='#7f8c8d'; ctx.beginPath(); ctx.ellipse(o.x+o.w/2,o.y+o.h/2,o.w/2,o.h/2,0,0,Math.PI*2); ctx.fill() }
  }

  const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
  const getSpeed=()=>4+Math.floor(time/12);
  const getGap=()=>Math.max(1100,2100-time*15);

  function drawBG(spd){
    ctx.fillStyle='#c6ebf7'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    clouds.forEach(c=>{c.x-=spd*.12*c.s;if(c.x<-60)c.x=W+30;ctx.beginPath();ctx.arc(c.x,c.y,16*c.s,0,Math.PI*2);ctx.fill()});
    ctx.fillStyle='#9b7428'; ctx.fillRect(0,gY,W,H-gY+10);
    ctx.fillStyle='#82c568'; ctx.fillRect(0,gY-8,W,14);
  }

  function loop(ts){
    if(!run) return;
    const dt=Math.min(ts-lastT,50); lastT=ts; time+=dt/1000; score=Math.floor(time*10);
    scoreDisp.textContent=`Masa: ${Math.floor(time)}s | Skor: ${score}`;
    
    const spd=getSpeed(); obsT+=dt;
    if(obsT>getGap()){obsT=0;addObs()}

    dino.update();
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i]; o.x-=spd;
      if(hit(dino.box(),o)) return gameOver();
      if(o.x<-60) obstacles.splice(i,1);
    }

    drawBG(spd); obstacles.forEach(drawObs); dino.draw();
    requestAnimationFrame(loop);
  }

  function startGame(){
    if(!nameInp.value.trim()) nameInp.value='Pemain';
    run=true; time=score=obsT=0; obstacles=[]; pending=null; dino.reset(); initClouds();
    startP.style.display='none'; overP.style.display='none'; leaderP.style.display='none';
    lastT=performance.now(); requestAnimationFrame(loop);
    try{beep(520,.08);setTimeout(()=>beep(650,.1),60)}catch(e){}
  }

  function gameOver(){
    run=false; beep(200,.25,'sawtooth');
    const sec=Math.floor(time%60),min=Math.floor(time/60);
    const tStr=min?`${min}m ${sec}s`:`${sec}s`;
    finalInfo.innerHTML=`Masa: <strong>${tStr}</strong><br>Skor: <strong>${score}</strong>`;
    pending={name:nameInp.value.trim()||'Pemain',score,time:tStr};
    
    const qualify=!leaderboard.length || leaderboard.length<10 || score>leaderboard.at(-1).score;
    newNotif.style.display=qualify?'block':'none'; submitBtn.style.display=qualify?'inline-block':'none';
    
    setTimeout(()=>{overP.style.display='flex'},220);
  }

  // Kawalan BUTANG & SENTUH - dibetulkan supaya tak beku
  const tryJump=e=>{e?.preventDefault();if(run)dino.doJump()};
  
  startBtn.addEventListener('click',startGame);
  againBtn.addEventListener('click',startGame);
  submitBtn.onclick=()=>{addScore(pending.name,pending.score,pending.time);submitBtn.textContent='✓ Disimpan';submitBtn.disabled=true};
  
  leaderBtn.onclick=()=>{renderLeaderboard();startP.style.display='none';leaderP.style.display='flex'};
  toLeaderBtn.onclick=()=>{renderLeaderboard();overP.style.display='none';leaderP.style.display='flex'};
  closeLeaderBtn.onclick=()=>{leaderP.style.display='none';(pending?overP:startP).style.display='flex'};

  canvas.addEventListener('touchstart',tryJump,{passive:false});
  canvas.addEventListener('mousedown',tryJump);
  document.addEventListener('keydown',e=>e.code==='Space'&&tryJump(e));

  // Permulaan
  initClouds(); drawBG(3); dino.draw();
});
</script>
</body>
