<!DOCTYPE html>
 <html lang="ms">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
     
     <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
     <meta http-equiv="Pragma" content="no-cache">
     <meta http-equiv="Expires" content="0">
     
     <title>Dino Runner - Gaya Baru</title>
     <script src="https://cdn.tailwindcss.com"></script>
     <script>
         tailwind.config = {
             theme: { extend: { colors: { gelap:'#0f172a', dino:'#22c55e', dinoPerut:'#86efac', dinoMata:'#fff', dinoGelap:'#166534', tanah:'#78350f', rumput:'#15803d' }}}
         }
     </script>
     <style>
         * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
         html, body { height:100%; overflow:hidden; font-family:'Segoe UI', sans-serif; background:#020617; display:flex; align-items:center; justify-content:center; padding:0.5rem;}
         #gameContainer { position:relative; width:100%; max-width:900px; height:min(70vh, 500px); border-radius:16px; overflow:hidden; box-shadow:0 12px 45px rgba(0,0,0,.5);}
         #gameCanvas { display:block; width:100%; height:100%; background:linear-gradient(#a5d8ff, #e0f7ff); touch-action:none;}
         #sentuhPerintang { position:absolute; inset:0; z-index:5; cursor:pointer; }
         #paparanSkor { position:absolute; top:10px; left:10px; background:rgba(255,255,255,.94); padding:8px 16px; border-radius:10px; font-weight:bold; font-size:1.1rem; color:#0f172a; z-index:6; box-shadow:0 2px 10px rgba(0,0,0,.15);}
         .skrin { position:absolute; inset:0; background:rgba(15,23,42,.9); display:flex; flex-direction:column; justify-content:center; align-items:center; color:white; padding:1.5rem; z-index:10;}
         .sembunyi { display:none !important;}
         .btn { border:none; padding:1rem 2.5rem; border-radius:14px; font-weight:bold; font-size:1.2rem; color:white; margin:.6rem; cursor:pointer; transition:transform .15s ease; width:min(95%,300px); box-shadow:0 6px 15px rgba(0,0,0,.3);}
         .btn:active { transform:scale(.95);}
         .btn-biru { background:#2563eb;}
         .btn-kuning { background:#d97706;}
         .btn-hijau { background:#16a34a;}
         .input { padding:.9rem; border-radius:12px; border:none; width:min(95%,300px); font-size:1.1rem; color:#111; text-align:center; margin-bottom:1rem;}
         .senarai { background:#1e293b; border-radius:14px; max-width:450px; width:95%; max-height:55vh; overflow:auto; margin-top:1rem;}
         .tajuk { background:#0f172a; padding:1rem; text-align:center; font-weight:bold; font-size:1.4rem; border-radius:14px 14px 0 0;}
         .baris { display:flex; justify-content:space-between; padding:.9rem 1.2rem; border-bottom:1px solid #334155;}
         .g1{background:#b45309; color:#fff; font-weight:bold;}
         .g2{background:#64748b; color:#fff; font-weight:bold;}
         .g3{background:#713f12; color:#fff; font-weight:bold;}
     </style>
 </head>
 <body>
     <div id="gameContainer">
         <canvas id="gameCanvas"></canvas>
         <div id="paparanSkor">Skor: 0</div>
         <div id="sentuhPerintang"></div>
         <div id="mulaSkrin" class="skrin">
             <h1 class="text-4xl font-bold mb-3">🦖 Dino Runner</h1>
             <p class="mb-2 text-lg">👆 Ketuh skrin mana-mana untuk lompat</p>
             <p class="mb-6 text-slate-300">Mula perlahan & makin laju lama-kelamaan</p>
             <button id="btnMula" class="btn btn-biru">▶️ MULAI PERMAINAN</button>
             <button id="btnPapan" class="btn btn-kuning">🏆 Papan Skor</button>
         </div>
         <div id="tamatSkrin" class="skrin sembunyi">
             <h2 class="text-3xl font-bold mb-3 text-red-400">PERMAINAN TAMAT!</h2>
             <p class="text-xl mb-1">Masa bertahan: <span id="tMasa">0</span> saat</p>
             <p class="text-2xl font-bold mb-4">Skor: <span id="tSkor" class="text-yellow-300">0</span></p>
             <input type="text" id="namaPemain" class="input" placeholder="Nama anda..." maxlength="16">
             <button id="simpanBtn" class="btn btn-hijau">✅ Simpan Rekod</button>
             <button id="ulangBtn" class="btn btn-biru">🔄 Main Semula</button>
             <button id="rumahBtn" class="btn bg-slate-600">🏠 Laman Utama</button>
         </div>
         <div id="papanSkrin" class="skrin sembunyi">
             <div class="senarai">
                 <div class="tajuk">🏆 10 TERATAS</div>
                 <div id="senaraiIsi"></div>
             </div>
             <button id="kembaliMula" class="btn btn-biru mt-4">⬅️ Kembali</button>
         </div>
     </div>
     <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
     <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
     <script>
     const firebaseConfig = {
       apiKey: "AlzaSyDQ_MoqFHsVIpfq8YefgToN1S9j-p8mRv0",
       authDomain: "dino-runner-scores.firebaseapp.com",
       databaseURL: "https://dino-runner-scores-default-rtdb.asia-southeast1.firebasedatabase.app",
       projectId: "dino-runner-scores",
       storageBucket: "dino-runner-scores.firebasestorage.app",
       messagingSenderId: "245416612085",
       appId: "1:245416612085:web:ebc76f43b983c9072fb5bc"
     };
     firebase.initializeApp(firebaseConfig);
     const db = firebase.database();
     const skorRef = db.ref("skor");
     let pendengar = null;
     // BUNYI RINGKAS SAHAJA - TIADA LATAR BELAKANG
     const Bunyi = {
         lompat() { try { const a=new (AudioContext||webkitAudioContext)(); const o=a.createOscillator(),g=a.createGain();o.type="triangle";o.frequency.setValueAtTime(400,a.currentTime);o.frequency.exponentialRampToValueAtTime(750,a.currentTime+.12);g.gain.value=.1;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.15);}catch(e){}},
         hentam() { try { const a=new (AudioContext||webkitAudioContext)(); const o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(180,a.currentTime);g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.25);}catch(e){}}
     };
     // ELEMEN & TETAPAN
     const c = document.getElementById("gameCanvas"), ctx = c.getContext("2d");
     const bekas = document.getElementById("gameContainer");
     const paparanSkor = document.getElementById("paparanSkor");
     const sentuhEl = document.getElementById("sentuhPerintang");
     const skrinMula = document.getElementById("mulaSkrin"), skrinTamat = document.getElementById("tamatSkrin"), skrinPapan = document.getElementById("papanSkrin");
     const senaraiIsi = document.getElementById("senaraiIsi");
     let main = false, masaTerdahulu = 0, skor = 0;
     let kelajuanAsas = 4.5, kelajuan = kelajuanAsas, tanahY = 0, skala = 1;
     let dino = {x:55,y:0,w:50,h:48,lajuLompat:0,diTanah:true}; // BESAR & GEMUK
     let halangan = [], masaHalang = 0;
     // SAIZ KANVAS TEPAT & TAJAM
     function saizKanvas() {
         const w = bekas.clientWidth, h = bekas.clientHeight;
         skala = window.devicePixelRatio || 1;
         c.width = w * skala; c.height = h * skala;
         ctx.setTransform(1,0,0,1,0,0); ctx.scale(skala,skala);
         tanahY = h - 55; dino.y = tanahY - dino.h;
     }
     window.addEventListener("resize", saizKanvas);
     // 🦖 DINO BAHARU: GEMUK, KUAT, KOMEL & JELAS
     function lukisDino() {
         ctx.save(); ctx.translate(dino.x, dino.y);
         // Badan besar & bulat
         ctx.fillStyle="#22c55e"; ctx.beginPath(); ctx.ellipse(25,26,23,21,0,0,Math.PI*2); ctx.fill();
         // Perut
         ctx.fillStyle="#86efac"; ctx.beginPath(); ctx.ellipse(27,30,14,11,0,0,Math.PI*2); ctx.fill();
         // Kepala Besar
         ctx.fillStyle="#22c55e"; ctx.beginPath(); ctx.ellipse(48,18,15,14,-.15,0,Math.PI*2); ctx.fill();
         // Mata Besar & Tajam
         ctx.fillStyle="#fff"; ctx.beginPath(); ctx.ellipse(54,12,7,6,0,0,Math.PI*2); ctx.fill();
         ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(56,13,3,0,Math.PI*2); ctx.fill();
         // Gigi/Duri Mulut
         ctx.fillStyle="#fff"; ctx.fillRect(55,22,4,4); ctx.fillRect(61,22,4,4);
         // Duri Belakang / Punggung
         ctx.fillStyle="#15803d";
         ctx.beginPath(); ctx.moveTo(12,14); ctx.lineTo(18,0); ctx.lineTo(26,12); ctx.fill();
         ctx.beginPath(); ctx.moveTo(24,12); ctx.lineTo(32,-2); ctx.lineTo(40,12); ctx.fill();
         ctx.beginPath(); ctx.moveTo(36,14); ctx.lineTo(44,2); ctx.lineTo(48,16); ctx.fill();
         // Kaki Pendek & Tegap
         ctx.fillStyle="#166534"; ctx.fillRect(12,40,9,10); ctx.fillRect(28,40,9,10);
         // Ekor Tebal
         ctx.fillStyle="#22c55e"; ctx.beginPath(); ctx.ellipse(0,32,11,8,-.8,0,Math.PI*2); ctx.fill();
         ctx.restore();
     }
       // HALANGAN: SEMUA DUDUK DI TANAH, TAK TERAPUNG!
     function lukisHalang(h) {
         ctx.save(); ctx.translate(h.x, h.y);
         if(h.jenis === "pokok"){
             ctx.fillStyle="#78350f"; ctx.fillRect((h.w/2)-7,0,14,h.h*0.5);
             ctx.fillStyle="#15803d"; ctx.beginPath(); ctx.arc(h.w/2, -8, h.w/1.85, 0, Math.PI*2); ctx.fill();
         } else if(h.jenis === "kaktus"){
             ctx.fillStyle="#16a34a"; ctx.fillRect(11,0,13,h.h); ctx.fillRect(0,h.h*0.25,13,10); ctx.fillRect(11,h.h*0.4,h.w,h.h*.11); ctx.fillRect(24,h.h*.25,12,9);
         } else { // Pagar
             ctx.fillStyle="#713f12"; ctx.fillRect(3,0,5,h.h); ctx.fillRect(h.w-8,0,5,h.h); ctx.fillRect(0,h.h*.35,h.w,5); ctx.fillRect(0,h.h*.6,h.w,5);
         }
         ctx.restore();
     }
     function latar() {
         const w = bekas.clientWidth, h = bekas.clientHeight;
         ctx.fillStyle="#a5d8ff"; ctx.fillRect(0,0,w,h);
         ctx.fillStyle="#15803d"; ctx.fillRect(0,tanahY,w,10); // Garis rumput di atas
         ctx.fillStyle="#78350f"; ctx.fillRect(0,tanahY+10,w,h-tanahY); // Tanah padat
     }
     function buatHalangan() {
         const jenis = ["pokok","kaktus","pagar"][Math.floor(Math.random()*3)];
         const ukuran = {pokok:{w:42,h:52},kaktus:{w:38,h:50},pagar:{w:40,h:46}}[jenis];
         halangan.push({x: bekas.clientWidth+20, y: tanahY-ukuran.h, w:ukuran.w, h:ukuran.h, jenis:jenis});
     }
     // LOMBAT KAWALAN
     function lompat() { if(dino.diTanah && main){ dino.lajuLompat=-15; dino.diTanah=false; Bunyi.lompat();} }
     // GELUNG UTAMA: KELAJUAN PERLAHAN & SKOR BETUL
     function gelungUtama(masa) {
         if(!main) return;
         const delta = Math.min((masa - masaTerdahulu)/16, 2.5);
         masaTerdahulu = masa;
         // ✅ Kelajuan bertambah SANGAT LAMBAT (tak mendadak laju)
         kelajuan = kelajuanAsas + (skor/250);
         if(kelajuan>11) kelajuan=11;
         // Skor sentiasa bertambah & dikemaskini
         skor += Math.round(delta);
         paparanSkor.textContent = `Skor: ${skor}`;
         // Graviti lancar
         if(!dino.diTanah){
             dino.lajuLompat += 1.2 * delta; dino.y += dino.lajuLompat * delta;
             if(dino.y + dino.h >= tanahY){ dino.y = tanahY - dino.h; dino.diTanah=true; dino.lajuLompat=0; }
         }
         // Halangan & jarak selesa
         masaHalang += delta;
         if(masaHalang>Math.max(55, 100 - kelajuan*4)){ buatHalangan(); masaHalang=0; }
         halangan = halangan.filter(h=>{ h.x -= kelajuan*delta; return h.x + h.w > -15; });
         // Perlanggaran TEPAT
         for(let h of halangan){
             let pelarasan = 8;
             if(dino.x+pelarasan < h.x+h.w-pelarasan && dino.x+dino.w-pelarasan>h.x+pelarasan && dino.y+dino.h-pelarasan>h.y){
                 main = false; Bunyi.hentam(); tamat(); return;
             }
         }
         latar(); halangan.forEach(lukisHalang); lukisDino();
         requestAnimationFrame(gelungUtama);
     }
     function mula() {
         skrinMula.classList.add("sembunyi"); skrinTamat.classList.add("sembunyi"); skrinPapan.classList.add("sembunyi");
         saizKanvas(); main=true; masaTerdahulu=performance.now(); skor=0; kelajuan=kelajuanAsas; halangan=[]; masaHalang=0;
         dino.x=50; dino.y=tanahY-dino.h; dino.diTanah=true; paparanSkor.textContent="Skor: 0";
         requestAnimationFrame(gelungUtama);
     }
     function tamat() {
         document.getElementById("tSkor").textContent = skor;
         document.getElementById("tMasa").textContent = Math.floor((performance.now()-masaTerdahulu)/1000);
         skrinTamat.classList.remove("sembunyi");
     }
     async function simpan() {
         const nama = document.getElementById("namaPemain").value.trim() || "Anonim";
         await skorRef.push({ nama:nama, skor:skor, tarikh: new Date().toISOString() }); alert("✅ Disimpan!"); lihatPapan();
     }
     function lihatPapan() {
         skrinMula.classList.add("sembunyi"); skrinTamat.classList.add("sembunyi"); skrinPapan.classList.remove("sembunyi");
         if(pendengar) skorRef.off("value", pendengar);
         pendengar = skorRef.orderByChild("skor").limitToLast(10).on("value", snap=>{
             senaraiIsi.innerHTML = "";
             if(!snap.exists()){ senaraiIsi.innerHTML="<p class='p-5 text-center'>Belum ada rekod</p>"; return; }
             let data = Object.values(snap.val()).sort((a,b)=>b.skor - a.skor);
             data.forEach((p,i)=>{
                 const el = document.createElement("div"); el.className = `baris g${i+1<=3?i+1:""}`;
                 el.innerHTML = `<span>${i+1}. ${p.nama}</span><span>${p.skor}</span>`;
                 senaraiIsi.appendChild(el);
             });
         });
     }
     function tutupPapan() {
         skrinPapan.classList.add("sembunyi"); skrinMula.classList.remove("sembunyi");
         if(pendengar){ skorRef.off("value",pendengar); pendengar=null; }
     }
     // KAWALAN SENTUH & PAPAN KEKUNCI
     function ikatKawalan() {
         const tekan = (e)=>{ e?.preventDefault?.(); if(main) lompat(); };
         sentuhEl.addEventListener("touchstart",tekan,{passive:false});
         sentuhEl.addEventListener("mousedown",tekan);
         c.addEventListener("touchstart",tekan,{passive:false});
         document.addEventListener("keydown",e=>{ if(e.code==="Space"||e.code==="ArrowUp"){ e.preventDefault(); lompat(); }});
     }
     // BUTANG
     document.getElementById("btnMula").onclick = mula;
     document.getElementById("ulangBtn").onclick = mula;
     document.getElementById("simpanBtn").onclick = simpan;
     document.getElementById("btnPapan").onclick = lihatPapan;
     document.getElementById("rumahBtn").onclick = tutupPapan;
     document.getElementById("kembaliMula").onclick = tutupPapan;
     // SIAPKAN PERTAMA KALI
     saizKanvas(); ikatKawalan(); latar(); lukisDino();
     </script>
 </body>
 </html>
