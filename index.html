<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>Dino Runner - Lompat Halangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gelap:'#0f172a', bumi:'#15803d', tanah:'#78350f', dino:'#22c55e', dinoGelap:'#166534', langit:'#87ceeb' }}}
        }
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        html, body { 
            height:100%; overflow:hidden; font-family:'Segoe UI', sans-serif;
            background:#0f172a; display:flex; align-items:center; justify-content:center; padding:8px;
        }
        #gameContainer { 
            position:relative; width:100%; max-width:900px; height:min(72vh, 480px);
            border-radius:16px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.4);
        }
        #gameCanvas { display:block; width:100%; height:100%; background:linear-gradient(#87ceeb, #e0f2fe); touch-action:manipulation; }
        .skrin { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(15,23,42,0.88); color:white; padding:1.5rem; z-index:10; }
        .sembunyi { display:none !important; }
        .btn { background:#2563eb; border:none; padding:0.9rem 2.2rem; border-radius:12px; font-weight:bold; font-size:1.15rem; color:white; margin:0.6rem; cursor:pointer; transition:transform .15s; width:min(100%, 280px); box-shadow:0 4px 12px rgba(0,0,0,.25); }
        .btn:active { transform:scale(0.94); }
        .btn-amber { background:#d97706; }
        .btn-hijau { background:#16a34a; }
        .input { padding:0.85rem; border-radius:10px; border:none; width:min(100%,290px); font-size:1rem; color:#111; margin-bottom:1rem; text-align:center; }
        .baris { display:flex; justify-content:space-between; width:100%; padding:.7rem 1rem; border-bottom:1px solid #334155; gap:1rem;}
        .ke-1{background:#ca8a04; color:#fff; font-weight:bold;}
        .ke-2{background:#64748b; color:#fff; font-weight:bold;}
        .ke-3{background:#78350f; color:#fff; font-weight:bold;}
        #senaraiSkor { width:min(95%,450px); max-height:55vh; overflow-y:auto; background:#1e293b; border-radius:12px; margin:1rem 0; }
        .tajuk { text-align:center; font-size:1.4rem; font-weight:bold; padding:.9rem; background:#0f172a; border-radius:12px 12px 0 0; }
        #sentuhPerintang { position:absolute; inset:0; z-index:5; cursor:pointer; }
        #paparanSkor{position:absolute;top:12px;left:12px;z-index:6;background:rgba(255,255,255,.92);padding:6px 14px;border-radius:8px;font-weight:bold;color:#0f172a;box-shadow:0 3px 10px #0003;}
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="paparanSkor">Skor: 0</div>
        <div id="sentuhPerintang"></div>

        <div id="mulaSkrin" class="skrin">
            <h1 class="text-3xl font-bold mb-4">🦖 Dino Runner</h1>
            <p class="mb-2 text-center text-slate-200">Ketuh mana-mana untuk lompat</p>
            <p class="mb-6 text-center text-slate-300 text-sm">Elak kaktus & halangan!</p>
            <button id="btnMula" class="btn">MULAI PERMAINAN</button>
            <button id="btnPapan" class="btn btn-amber">🏆 Papan Skor</button>
        </div>

        <div id="tamatSkrin" class="skrin sembunyi">
            <h2 class="text-2xl font-bold mb-2 text-red-400">PERMAINAN TAMAT</h2>
            <p class="mb-1">Masa: <span id="masaTamat">0</span> saat</p>
            <p class="mb-4 text-xl font-semibold">Skor: <span id="skorTamat" class="text-yellow-300">0</span></p>
            <input type="text" id="namaPemain" class="input" placeholder="Nama anda..." maxlength="16">
            <button id="btnSimpan" class="btn btn-hijau">✅ Simpan Skor</button>
            <button id="btnUlang" class="btn">🔄 Main Semula</button>
            <button id="btnUtama" class="btn bg-slate-600">🏠 Laman Utama</button>
        </div>

        <div id="papanSkrin" class="skrin sembunyi">
            <div id="senaraiSkor">
                <div class="tajuk">🏆 10 TERATAS</div>
                <div id="isiPapan"></div>
            </div>
            <button id="kembaliUtama" class="btn">KEMBALI KE MULA</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script>
    const firebaseConfig = {
      apiKey: "AlzaSyDQ_MoqFHsVIpfq8YefgToN1S9j-p8mRv0",
      authDomain: "dino-runner-scores.firebaseapp.com",
      databaseURL: "https://dino-runner-scores-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dino-runner-scores",
      storageBucket: "dino-runner-scores.firebasestorage.app",
      messagingSenderId: "245416612085",
      appId: "1:245416612085:web:ebc76f43b983c9072fb5bc"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const skorRef = db.ref("skor");
    let pendengarSkor = null;

    // ✅ SISTEM BUNYI BAIK: TIDAK BERDESING / TIADA LATAR BELAKANG
    const Bunyi = {
        lompat: () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "triangle";
                osc.frequency.setValueAtTime(480, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.15);
            } catch (e) {}
        },
        hentam: () => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = "sawtooth";
                osc.frequency.setValueAtTime(210, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(55, ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + 0.25);
            } catch (e) {}
        }
    };

    const c=document.getElementById("gameCanvas"), ctx=c.getContext("2d");
    const bekas=document.getElementById("gameContainer");
    const sentuhEl=document.getElementById("sentuhPerintang");
    const paparanSkor=document.getElementById("paparanSkor");
    const skrinMula=document.getElementById("mulaSkrin"), skrinTamat=document.getElementById("tamatSkrin"), skrinPapan=document.getElementById("papanSkrin");
    const isiPapan=document.getElementById("isiPapan");

    let sedangMain=false, masaLalu=0, skor=0, kelajuan=5, tanahY=0, skala=1;
    let dino={x:60,y:0,w:38,h:46,lompatK:0,diTanah:true};
    let halangan=[], halangMasa=0;

    function tetapkanSaiz(){
        const lebar=bekas.clientWidth;
        const tinggi=bekas.clientHeight;
        skala=window.devicePixelRatio||1;
        c.width=lebar*skala; c.height=tinggi*skala;
        ctx.setTransform(1,0,0,1,0,0); ctx.scale(skala,skala);
        tanahY=tinggi - 45; dino.y=tanahY-dino.h;
    }
    window.addEventListener("resize", tetapkanSaiz);

    // ✅ BENTUK DINO TULEN — BUKAN SEPERTI ANJING
    function lukisDino(){
        ctx.save(); ctx.translate(dino.x, dino.y);
        // Badan
        ctx.fillStyle="#22c55e";
        ctx.beginPath(); ctx.ellipse(18, 26, 16, 19, 0, 0, Math.PI*2); ctx.fill();
        // Kepala
        ctx.fillStyle="#22c55e";
        ctx.beginPath(); ctx.ellipse(36,16,11,13, -0.2,0,Math.PI*2); ctx.fill();
        // Mata & Mulut
        ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(40,12,5,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#000"; ctx.beginPath(); ctx.arc(42,13,2.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle="#166534"; ctx.fillRect(44,20,5,2);
        // Belakang/Duri
        ctx.fillStyle="#16a34a";
        ctx.beginPath(); ctx.moveTo(8,18); ctx.lineTo(14,4); ctx.lineTo(20,18); ctx.fill();
        ctx.beginPath(); ctx.moveTo(16,20); ctx.lineTo(22,6); ctx.lineTo(28,20); ctx.fill();
        // Kaki
        ctx.fillStyle="#15803d"; ctx.fillRect(11,38,6,9); ctx.fillRect(24,38,6,9);
        // Ekor pendek
        ctx.fillStyle="#22c55e";
        ctx.beginPath(); ctx.ellipse(2,30,7,5, -.6,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }

    // HALANGAN: POKOK / KAKTUS / PAGAR BAHARU & KEMAS
    function lukisHalang(h){
        ctx.save(); ctx.translate(h.x,h.y);
        if(h.jenis==="kaktus"){
            ctx.fillStyle="#15803d";
            ctx.fillRect(10,0,14,h.h); // Batang utama
            ctx.fillRect(0,h.h*0.25,12,9); ctx.fillRect(0,h.h*0.12,7,18); // Kiri
            ctx.fillRect(12,h.h*0.45,12,9); ctx.fillRect(19,h.h*0.32,7,18); // Kanan
        } else if(h.jenis==="pagar"){
            ctx.fillStyle="#78350f";
            ctx.fillRect(4,0,5,h.h); ctx.fillRect(h.w-8,0,5,h.h);
            ctx.fillRect(0,h.h*0.33,h.w,5); ctx.fillRect(0,h.h*0.6,h.w,5);
            // Durian ringkas & kemas sahaja
            ctx.fillStyle="#44403c";
            for(let i=6; i<h.w-10; i+=11){
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+4,-7); ctx.lineTo(i+8,0); ctx.fill();
            }
        } else { // Pokok besar & cantik
            ctx.fillStyle="#713f12"; ctx.fillRect((h.w/2)-6,0,12,h.h*0.55);
            ctx.fillStyle="#166534"; ctx.beginPath(); ctx.arc(h.w/2,-6,h.w/2.1,0,Math.PI*2); ctx.fill();
        }
        ctx.restore();
    }

    function buatHalangan(){
        const jenis=["kaktus","pagar","pokok"][Math.floor(Math.random()*3)];
        const saiz={pokok:{w:40,h:50},kaktus:{w:34,h:48},pagar:{w:36,h:44}}[jenis];
        halangan.push({x:bekas.clientWidth+15,y:tanahY-saiz.h,w:saiz.w,h:saiz.h,jenis});
    }

    function lukisLatar(){
        const w=bekas.clientWidth;
        ctx.fillStyle="#87ceeb"; ctx.fillRect(0,0,w,tanahY);
        ctx.fillStyle="#15803d"; ctx.fillRect(0,tanahY-6,w,10); // Rumput
        ctx.fillStyle="#78350f"; ctx.fillRect(0,tanahY+4,w,bekas.clientHeight-tanahY);
    }

    function gelung(t){
        if(!sedangMain) return;
        const dT=Math.min((t-masaLalu)/16,2.2); masaLalu=t;
        skor+=Math.round(dT/2.8); kelajuan=Math.min(13,5+skor/65);
        paparanSkor.textContent="Skor: "+skor;

        if(!dino.diTanah){
            dino.lompatK += 1.15*dT; dino.y += dino.lompatK*dT;
            if(dino.y+dino.h >= tanahY){
                dino.y=tanahY-dino.h; dino.diTanah=true; dino.lompatK=0;
            }
        }

        halangMasa+=dT; if(halangMasa>Math.max(40,75-kelajuan*2.5)){ buatHalangan(); halangMasa=0; }
        halangan=halangan.filter(h=>{h.x-=kelajuan*dT; return h.x+h.w>-15;});

        for(let h of halangan){
            if(dino.x+7 <h.x+h.w-7 && dino.x+dino.w-7>h.x+7 && dino.y+dino.h-6>h.y){
                sedangMain=false; Bunyi.hentam(); tamatMain(); return;
            }
        }

        lukisLatar(); halangan.forEach(lukisHalang); lukisDino();
        requestAnimationFrame(gelung);
    }

    function lompat(){ if(dino.diTanah && sedangMain){ dino.lompatK=-14.5; dino.diTanah=false; Bunyi.lompat(); } }
    function mulaMain(){
        skrinMula.classList.add("sembunyi"); skrinTamat.classList.add("sembunyi"); skrinPapan.classList.add("sembunyi");
        tetapkanSaiz(); sedangMain=true; masaLalu=performance.now(); skor=0; halangan=[]; halangMasa=0;
        dino.x=50; dino.y=tanahY-dino.h; dino.diTanah=true; paparanSkor.textContent="Skor: 0";
        requestAnimationFrame(gelung);
    }
    function tamatMain(){
        document.getElementById("skorTamat").textContent=skor;
        document.getElementById("masaTamat").textContent=Math.floor((performance.now()-masaLalu)/1000);
        skrinTamat.classList.remove("sembunyi");
    }
    async function simpanSkor(){
        const nama=(document.getElementById("namaPemain").value||"Anonim").trim();
        await skorRef.push({nama,skor,tarikh:new Date().toISOString()}); alert("✅ Disimpan!"); bukaPapan();
    }

    function bukaPapan(){
        skrinMula.classList.add("sembunyi"); skrinTamat.classList.add("sembunyi"); skrinPapan.classList.remove("sembunyi");
        if(pendengarSkor) skorRef.off("value",pendengarSkor);
        pendengarSkor=skorRef.orderByChild("skor").limitToLast(10).on("value",s=>{
            isiPapan.innerHTML=""; if(!s.exists()){isiPapan.innerHTML="<p class='p-4 text-center'>Tiada rekod</p>";return;}
            const data=Object.values(s.val()).sort((a,b)=>b.skor-a.skor);
            data.forEach((p,i)=>{const el=document.createElement("div");el.className=`baris ke-${i+1<=3?i+1:""}`;el.innerHTML=`<span>${i+1}. ${p.nama}</span><span>${p.skor}</span>`;isiPapan.appendChild(el);});
        });
    }
    function tutupPapan(){ skrinPapan.classList.add("sembunyi"); skrinMula.classList.remove("sembunyi"); if(pendengarSkor){ skorRef.off(); pendengarSkor=null;} }

    function ikatKawalan(){
        const tekan=e=>{ e?.preventDefault?.(); if(sedangMain) lompat(); };
        sentuhEl.addEventListener("touchstart",tekan,{passive:false});
        sentuhEl.addEventListener("mousedown",tekan);
        c.addEventListener("touchstart",tekan,{passive:false});
        document.addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault(); lompat();}});
    }

    document.getElementById("btnMula").onclick=mulaMain;
    document.getElementById("btnUlang").onclick=mulaMain;
    document.getElementById("btnSimpan").onclick=simpanSkor;
    document.getElementById("btnPapan").onclick=bukaPapan;
    document.getElementById("btnUtama").onclick=tutupPapan;
    document.getElementById("kembaliUtama").onclick=tutupPapan;

    tetapkanSaiz(); ikatKawalan(); lukisLatar(); lukisDino();
    </script>
</body>
</html>
