<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dino Runner - Lompat Halangan</title>
    
    <!-- 🔧 PENTING: HALANG SIMPAN SALINAN LAMA / CACHE -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gelap:'#0f172a', bumi:'#1e293b', dino:'#22c55e', halang:'#dc2626' }}}
        }
    </script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { font-family:'Segoe UI', sans-serif; overflow:hidden; touch-action:none; }
        #gameCanvas { display:block; margin:0 auto; background:linear-gradient(#87ceeb, #e0f2fe); }
        .skrin { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center; background:rgba(15,23,42,0.85); color:white; padding:1rem; }
        .sembunyi { display:none !important; }
        .btn { background:#2563eb; border:none; padding:0.8rem 2rem; border-radius:10px; font-weight:bold; font-size:1.1rem; color:white; margin:0.5rem; cursor:pointer; transition:transform .15s; }
        .btn:active { transform:scale(0.95); }
        .input { padding:0.75rem; border-radius:8px; border:none; width:min(85%,280px); font-size:1rem; color:#111; }
        .baris { display:flex; justify-content:space-between; width:100%; padding:.6rem 1rem; border-bottom:1px solid #334155; }
        .ke-1{background:#ca8a04; color:#fff; font-weight:bold;}
        .ke-2{background:#64748b;}
        .ke-3{background:#78350f;}
        #senaraiSkor { width:min(95%,450px); max-height:55vh; overflow-y:auto; background:#1e293b; border-radius:12px; margin:1rem 0; }
        .tajuk { text-align:center; font-size:1.4rem; font-weight:bold; padding:.8rem; background:#0f172a; border-radius:12px 12px 0 0; }
    </style>
</head>
<body class="bg-slate-900">
    <canvas id="gameCanvas"></canvas>
    <!-- MULA -->
    <div id="mulaSkrin" class="skrin">
        <h1 class="text-3xl font-bold mb-4">🦖 Dino Runner</h1>
        <p class="mb-6 text-center text-slate-200">Ketuh skrin untuk lompat<br>Lama bertahan = Skor tinggi!</p>
        <button id="btnMula" class="btn">MULAI PERMAINAN</button>
        <button id="btnPapan" class="btn bg-amber-600">🏆 Papan Skor</button>
    </div>
    <!-- TAMAT -->
    <div id="tamatSkrin" class="skrin sembunyi">
        <h2 class="text-2xl font-bold mb-2 text-red-400">PERMAINAN TAMAT</h2>
        <p class="mb-1">Masa Dimain: <span id="masaTamat">0</span>s</p>
        <p class="mb-4 text-xl font-semibold">Skor: <span id="skorTamat" class="text-yellow-300">0</span></p>
        <input type="text" id="namaPemain" class="input" placeholder="Masukkan nama anda..." maxlength="16">
        <button id="btnSimpan" class="btn bg-green-600">✅ Simpan Skor</button>
        <button id="btnUlang" class="btn">🔄 Main Semula</button>
        <button id="btnUtama" class="btn bg-slate-600">🏠 Laman Utama</button>
    </div>
    <!-- PAPAN SKOR -->
    <div id="papanSkrin" class="skrin sembunyi">
        <div id="senaraiSkor">
            <div class="tajuk">10 TERATAS</div>
            <div id="isiPapan"></div>
        </div>
        <button id="kembaliUtama" class="btn">KEMBALI</button>
    </div>

    <!-- FIREBASE & PERPUSTAKAAN SERASI -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    
    <script>
    // ==========================================
    // KONFIGURASI FIREBASE ANDA (SUDAH BETUL)
    // ==========================================
    const firebaseConfig = {
      apiKey: "AlzaSyDQ_MoqFHsVIpfq8YefgToN1S9j-p8mRv0",
      authDomain: "dino-runner-scores.firebaseapp.com",
      databaseURL: "https://dino-runner-scores-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "dino-runner-scores",
      storageBucket: "dino-runner-scores.firebasestorage.app",
      messagingSenderId: "245416612085",
      appId: "1:245416612085:web:ebc76f43b983c9072fb5bc"
    };

    // MULA SISTEM PANGKALAN DATA
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const skorRef = db.ref("skor");
    let pendengarSkor = null; // KAWAL PENDENGAR: ELAK DATA LAMA & BERGANDA

    // SISTEM BUNYI MUDAH
    const Bunyi = {
        main: ()=>{const a=new AudioContext();a.resume();a.createOscillator().connect(a.destination).start()},
        lompat: ()=>{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g),g.connect(a.destination),o.frequency.value=500,g.gain.value=.08;o.start();o.frequency.exponentialRampToValueAtTime(900,a.currentTime+.12),g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15)},
        langgar: ()=>{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g),g.connect(a.destination),o.type="sawtooth",o.frequency.value=220,g.gain.value=.12;o.start();o.frequency.exponentialRampToValueAtTime(60,a.currentTime+.3)},
        tamat: ()=>{const a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g),g.connect(a.destination),o.frequency.value=300;[300,250,180].forEach((f,i)=>setTimeout(()=>o.frequency.value=f,i*160));g.gain.value=.1;o.start();o.stop(a.currentTime+.5);}
    };

    // KANVAS & ELEMEN ANTARAMUKA
    const c=document.getElementById("gameCanvas");
    const ctx=c.getContext("2d");
    function ubahSaiz(){c.width=Math.min(window.innerWidth,900);c.height=Math.min(window.innerHeight,520);}
    ubahSaiz();
    window.addEventListener("resize",ubahSaiz);

    let sedangMain=false, masaMula=0, masaLalu=0, skor=0, kelajuan=5, tanahY=0;
    let dino={x:80,y:0,w:44,h:55,lompatK:0,diTanah:true};
    let halangan=[], halangMasa=0;
    
    let skrinMula=document.getElementById("mulaSkrin");
    let skrinTamat=document.getElementById("tamatSkrin");
    let skrinPapan=document.getElementById("papanSkrin");
    let isiPapan=document.getElementById("isiPapan");

    // FUNGSI LUKISAN
    function lukisTanah(){tanahY=c.height-50;ctx.fillStyle="#1e293b";ctx.fillRect(0,tanahY,c.width,50);}
    function lukisDino(){ctx.fillStyle="#22c55e";ctx.fillRect(dino.x,dino.y,dino.w,dino.h);ctx.fillStyle="#fff";ctx.fillRect(dino.x+8,dino.y+8,9,9);ctx.fillStyle="#000";ctx.fillRect(dino.x+11,dino.y+11,4,4);}
    function lukisHalang(h){ctx.fillStyle=h.jenis==="pokok"?("#15803d"):("maroon");ctx.fillRect(h.x,h.y,h.w,h.h);}
    
    function buatHalang(){
        const jenis=["pokok","kaktus","pagar"][Math.floor(Math.random()*3)];
        let w=jenis==="pokok"?30:(jenis==="kaktus"?22:38);
        halangan.push({x:c.width+40,y:tanahY-(jenis==="pagar"?40:50),w:w,h:jenis==="pagar"?40:50,jenis});
    }

    // GELUNG PERMAINAN UTAMA
    function kemasKeadaan(t){
        if(!sedangMain) return;
        
        let dT=(t-masaLalu)/16; 
        masaLalu=t;
        kelajuan=5+Math.floor(skor/25);
        
        // Logik Lompatan & Graviti
        if(!dino.diTanah){
            dino.lompatK+=1.1*dT; 
            dino.y+=dino.lompatK*dT; 
            if(dino.y+dino.h>=tanahY){
                dino.y=tanahY-dino.h; 
                dino.diTanah=true; 
                dino.lompatK=0;
            }
        }
        
        // Hasilkan & Gerakkan Halangan
        halangMasa+=dT; 
        if(halangMasa>Math.max(35,70-kelajuan*2)){
            buatHalang(); 
            halangMasa=0;
        }
        halangan=halangan.filter(h=>{h.x-=kelajuan*dT; return h.x+h.w>0;});
        
        // Semak Perlanggaran
        for(let h of halangan){
            if(dino.x+dino.w-8>h.x && dino.x+8 <h.x+h.w && dino.y+dino.h-8>h.y){
                sedangMain=false; 
                Bunyi.langgar(); 
                Bunyi.tamat(); 
                tamatMain(); 
                return;
            }
        }

        // Kemas & Lukis Semula
        skor+=Math.round(dT/4);
        ctx.clearRect(0,0,c.width,c.height);
        lukisTanah(); 
        lukisDino(); 
        halangan.forEach(lukisHalang);
        ctx.font="bold 18px sans-serif"; 
        ctx.fillStyle="#fff";
        ctx.shadowColor="#000"; ctx.shadowBlur=2;
        ctx.fillText(`Skor: ${skor}`,15,30); 
        ctx.fillText(`Masa: ${((t-masaMula)/1000).toFixed(1)}s`,15,55);
        ctx.shadowBlur=0;

        requestAnimationFrame(kemasKeadaan);
    }
    
    // FUNGSI KAWALAN
    function lompat(){if(dino.diTanah&&sedangMain){dino.lompatK=-14; dino.diTanah=false; Bunyi.lompat();}}
    
    function mulaMain(){
        skrinMula.classList.add("sembunyi");
        skrinTamat.classList.add("sembunyi");
        skrinPapan.classList.add("sembunyi");
        sedangMain=true;
        masaLalu=performance.now();
        masaMula=masaLalu;
        skor=0;
        halangan=[];
        dino.x=80;
        dino.y=(c.height-50)-dino.h;
        dino.diTanah=true;
        Bunyi.main();
        requestAnimationFrame(kemasKeadaan);
    }
    
    function tamatMain(){
        document.getElementById("skorTamat").textContent=skor;
        document.getElementById("masaTamat").textContent=((performance.now()-masaMula)/1000).toFixed(1);
        skrinTamat.classList.remove("sembunyi");
    }
    
    async function simpanSkor(){
        let nama=document.getElementById("namaPemain").value.trim()||"Anonim";
        await skorRef.push({nama:nama,skor:skor,tarikh:new Date().toISOString()});
        alert("✅ Disimpan ke Papan Skor!"); 
        bukaPapan();
    }

    // PAPAN SKOR: LOGIK PENTING - ELAK DUPLIKAT / DATA LAMA
    function bukaPapan(){
        skrinMula.classList.add("sembunyi"); 
        skrinTamat.classList.add("sembunyi"); 
        skrinPapan.classList.remove("sembunyi");
        
        // ✅ LANGKAH 1: PUTUSKAN PENDENGAR LAMA JIKA ADA
        if(pendengarSkor) skorRef.off("value",pendengarSkor); 
        
        // ✅ LANGKAH 2: PASANG YANG BARU & KOSONG SENARAI SETIAP MASA
        pendengarSkor=skorRef.orderByChild("skor").limitToLast(10).on("value",(snap)=>{
            isiPapan.innerHTML=""; 
            if(!snap.exists()){isiPapan.innerHTML="<p class='p-4 text-center text-slate-300'>Belum ada rekod</p>";return;}
            
            // Susun: Skor tinggi ke bawah
            let data=Object.values(snap.val()).sort((a,b)=>b.skor-a.skor); 
            data.forEach((p,i)=>{
                const el=document.createElement("div");
                el.className=`baris ${i<3?"ke-"+(i+1):""}`;
                el.innerHTML=`<span>${i+1}. ${p.nama||"Pemain"}</span><span class="font-mono">${p.skor}</span>`;
                isiPapan.appendChild(el);
            });
        },(err)=>isiPapan.innerHTML="<p class='p-3 text-red-300'>Ralat: "+err.message+"</p>");
    }
    
    function tutupPapan(){
        skrinPapan.classList.add("sembunyi");
        skrinMula.classList.remove("sembunyi");
        // ✅ Bersihkan rujukan untuk elak kebocoran ingatan/sisa
        if(pendengarSkor){ 
            skorRef.off("value",pendengarSkor); 
            pendengarSkor=null; 
        }
    }

    // KAWALAN PERANTI: Sentuh, Tetikus & Papan Kekunci
    document.addEventListener("touchstart", (e)=>{
        e.preventDefault();
        if(sedangMain) lompat();
    }, {passive: false});
    
    document.addEventListener("mousedown", ()=>{ if(sedangMain) lompat(); });
    
    document.addEventListener("keydown", (e)=>{
        if(e.code==="Space" || e.code==="ArrowUp"){
            e.preventDefault();
            if(sedangMain) lompat();
        }
    });

    // PENGIKATAN BUTANG
    document.getElementById("btnMula").onclick = mulaMain;
    document.getElementById("btnUlang").onclick = mulaMain;
    document.getElementById("btnSimpan").onclick = simpanSkor;
    document.getElementById("btnPapan").onclick = bukaPapan;
    document.getElementById("btnUtama").onclick = tutupPapan;
    document.getElementById("kembaliUtama").onclick = tutupPapan;
    
    // Lukis permulaan kosong
    lukisTanah(); lukisDino();
    </script>
</body>
</html>
